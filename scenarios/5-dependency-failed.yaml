spec:
  template:
    spec:
      containers:
        - name: nginx

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Starting crash-demo application..."
              echo "Checking required payment dependency..."

              attempt=1

              while [ "$attempt" -le 3 ]; do

                echo "Dependency check attempt=$attempt"

                if wget -q -T 2 -O- http://payment-api:8080/health; then
                  echo "Payment dependency is healthy."
                  echo "Starting nginx..."
                  exec nginx -g 'daemon off;'
                fi

                echo "Payment dependency unavailable."
                attempt=$((attempt + 1))
                sleep 2
              done

              echo "FATAL: required dependency payment-api is unavailable."
              exit 1